name: Topic Engine

# Hands-free short-form topic discovery. On a weekly schedule it pulls fresh
# signals (Reddit pain points, Google Trends via SerpApi, YouTube breakouts,
# seed questions), scores them for short-form potential, generates Nuno-led
# scripts + briefs, and commits the ranked topics + dashboard-ready
# data/shorts.json straight to main. That auto-redeploys the Cloudflare Pages
# dashboard, where review happens.
#
# Requires repo secrets (Settings -> Secrets and variables -> Actions):
#   YOUTUBE_API_KEY, SERPAPI_API_KEY  - signal sources
#   OPENAI_API_KEY                    - writes the topic ANGLES
# Missing signal keys are handled gracefully (those sources are simply skipped),
# but add both for full signal (Google Trends + YouTube).
#
# OPENAI_API_KEY is what makes topic supply unbounded. Without it the engine
# falls back to angle_for_cluster(), a fixed bank of ten titles - and because
# education dedup blocks every title already scheduled through Ayrshare
# (permanently), a ten-title ceiling is guaranteed to exhaust. With the key, the
# engine sends the week's signal clusters plus every published title to the
# writer and gets back angles that avoid all of them. Set IW_TOPIC_ANGLES_LLM=0
# or pass --no-llm to force the static bank.

on:
  schedule:
    - cron: "0 5 * * 1"      # every Monday 05:00 UTC
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: topic-engine
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openai

      - name: Run topic engine
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          set -o pipefail
          python social-media/tools/shorts_topic_engine.py | tee /tmp/topics.log

      - name: Commit and push to main if there are changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes - nothing new this run. Done."
            exit 0
          fi

          git config user.name  "internwise-content-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/shorts.json social-media/video/topics social-media/video/scripts
          git commit -m "Topic engine refresh ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "Pushed refreshed topics; Cloudflare Pages will redeploy."
