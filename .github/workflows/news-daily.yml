name: News - Day-Prior Build

# Builds the NEXT posting day's news card the day before it goes out, so headlines
# are never stale. Fetches fresh UK news, has the LLM reword it, renders the card,
# and upserts it into data/weeks.json as `approved` (creating the week entry if
# the Saturday batch hasn't run yet). Standard cadence is Mon-Fri. The workflow
# runs daily only so the week18 late-start catch-up can build Sat/Sun news through
# 2026-10-04; after that, the script skips weekend targets.
#
# News has NO manual approval gate (unlike the evergreen lanes): once built it is
# auto-approved and SCHEDULED straight to Ayrshare for the 8am UK news slot on its
# posting day. Because the build runs the day before, that slot is always in the
# future, so the post is queued (not sent immediately). The dashboard still shows
# it, now already 'approved', for visibility. The UK-only / no-naming-orgs news
# rules are enforced in news_fetch + the writer, not by a human click.
#
# Requires repo secrets: OPENAI_API_KEY (+ optional var OPENAI_MODEL), AYRSHARE_API_KEY,
# PEXELS_API_KEY, and the R2_* set. News image policy is Pexels by default for
# unattended cloud runs; explicit repo images are only for manual dispatches.

on:
  schedule:
    - cron: "0 6 * * *"       # 06:00 UTC daily; script skips weekend targets after the week18 catch-up
  workflow_dispatch:
    inputs:
      date:
        description: "Posting date YYYY-MM-DD to build (blank = tomorrow)"
        required: false
        default: ""
      image:
        description: "Optional repo path to a supplied editorial image for manual runs"
        required: false
        default: ""
      publish:
        description: "Post/schedule to Ayrshare after build? Use false for dashboard review only."
        required: false
        default: "true"
      max_age_days:
        description: "Maximum RSS story age in days. Keep 5 by default; widen only for manual review."
        required: false
        default: "5"

permissions:
  contents: write

concurrency:
  # Share the Daily-5 group so news and the weekly batch never push over each other.
  group: daily5-build
  cancel-in-progress: false

jobs:
  build-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install openai playwright pillow boto3 requests python-dotenv
          python -m playwright install --with-deps chromium

      - name: Build the day-prior news post
        id: build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IW_ALLOW_NEWS_NOT_DAY_PRIOR: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.date != '' && '1' || '' }}
          IW_TEMP_WEEKEND_NEWS_UNTIL: "2026-10-04"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -o pipefail   # a build_news_day crash must fail the job, not be masked by tee
          EXTRA_ARGS=()
          if [ -n "${{ github.event.inputs.image }}" ]; then
            EXTRA_ARGS+=(--image "${{ github.event.inputs.image }}")
          fi
          if [ -n "${{ github.event.inputs.max_age_days }}" ]; then
            EXTRA_ARGS+=(--max-age-days "${{ github.event.inputs.max_age_days }}")
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.publish }}" != "true" ]; then
            EXTRA_ARGS+=(--status in-review)
          fi
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python social-media/tools/build_news_day.py --date "${{ github.event.inputs.date }}" "${EXTRA_ARGS[@]}" | tee /tmp/news.log
          else
            python social-media/tools/build_news_day.py "${EXTRA_ARGS[@]}" | tee /tmp/news.log
          fi

      - name: Commit and push built news to main
        if: steps.build.outputs.pid != '' && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true')
        run: |
          FILES="images data/weeks.json social-media/content/news_used.json social-media/content/news_image_used.json"
          if [ -z "$(git status --porcelain $FILES)" ]; then
            echo "No build changes to commit."
            exit 0
          fi
          git config user.name  "internwise-content-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A $FILES
          git commit -m "News day-prior build ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Pushed the day-prior news to the dashboard."

      - name: Schedule the news post to Ayrshare (8am UK slot)
        id: schedule
        # Only after a real build. --only
        # names the freshly built post and bypasses the file-status gate; --schedule
        # queues it at the news lane time on its posting day (always in the future,
        # since we build the day before) rather than posting immediately.
        if: steps.build.outputs.pid != ''
        env:
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
          AYRSHARE_ACTIVE_NETWORKS: instagram,facebook,linkedin,threads,gmb,pinterest
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.publish }}" != "true" ]; then
            echo "Dashboard-review build: skipping Ayrshare publish."
            exit 0
          fi
          python social-media/tools/ayrshare_publish.py \
            --week "${{ steps.build.outputs.wid }}" \
            --only "${{ steps.build.outputs.pid }}" \
            --schedule --live | tee /tmp/news_schedule.log

      - name: Commit and push Ayrshare ledger if it changed
        if: always() && steps.build.outputs.pid != '' && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true')
        run: |
          FILES="social-media/content/ayrshare_posted.json"
          if [ -z "$(git status --porcelain $FILES)" ]; then
            echo "No Ayrshare ledger changes."
            exit 0
          fi
          git config user.name  "internwise-content-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A $FILES
          git commit -m "Record news Ayrshare schedule ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Pushed Ayrshare schedule ledger."
