name: News - Day-Prior Build

# Builds the NEXT posting day's news card the day before it goes out, so headlines
# are never stale. Fetches fresh UK news, has the LLM reword it, renders the card,
# and upserts it into data/weeks.json as `in-review` (creating the week entry if
# the Saturday batch hasn't run yet). Weekends are skipped automatically. The human
# gate is unchanged: review + approve on the dashboard before it goes to Ayrshare.
#
# Requires repo secret: OPENAI_API_KEY (+ optional var OPENAI_MODEL) and the R2_* set.

on:
  schedule:
    - cron: "0 6 * * 0-4"     # 06:00 UTC Sun-Thu -> builds Mon-Fri news the day before
  workflow_dispatch:
    inputs:
      date:
        description: "Posting date YYYY-MM-DD to build (blank = tomorrow)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # Share the Daily-5 group so news and the weekly batch never push over each other.
  group: daily5-build
  cancel-in-progress: false

jobs:
  build-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install openai playwright pillow boto3
          python -m playwright install --with-deps chromium

      - name: Build the day-prior news post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -o pipefail   # a build_news_day crash must fail the job, not be masked by tee
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python social-media/tools/build_news_day.py --date "${{ github.event.inputs.date }}" | tee /tmp/news.log
          else
            python social-media/tools/build_news_day.py | tee /tmp/news.log
          fi

      - name: Commit and push to main if there are changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes (weekend, or nothing built). Done."
            exit 0
          fi
          git config user.name  "internwise-content-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A images data/weeks.json social-media/content/news_used.json
          git commit -m "News day-prior build ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Pushed the day-prior news as in-review; review on the dashboard before Ayrshare."
