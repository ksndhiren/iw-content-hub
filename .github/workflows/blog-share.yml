name: Blog Re-share

# TWO internwise.com/blog articles per day, shared to LinkedIn, Facebook and
# Google Business Profile at 10:30 and 11:00 UK. The articles picked are the
# newest ones PUBLISHED BEFORE TODAY that are not yet on every target network.
# Skipping today's posts means this run never has to wait on an article that may
# not be up yet when the cron fires. The backlog drains steadily, so a day with
# no new blog post still has something to go out.
#
# The rate was raised from one to two on 2026-10-20 to work through a backlog of
# 69 unshared articles (~35 days at this cadence). Drop it back to 1 once the
# dry-run plan stops finding a full day's worth.
#
# Recency comes from the site sitemap (<lastmod>); the /blog listing itself is a
# React SPA and cannot be scraped directly. Each post is a link share (no
# image) - the network unfurls the URL card.
#
# These are auto-scheduled LIVE (no dashboard gate) - blog re-shares are low-risk
# link posts. The dedupe file (blog_shared.json) is committed back so the same
# article is never shared to the same network twice.
#
# NOTE: a target network only receives posts while it is connected in Ayrshare.
# Any requested network that is not connected is reported in the run log and
# skipped - check that log if a network goes quiet.
#
# Requires repo secret: AYRSHARE_API_KEY.

on:
  schedule:
    # 02:17 UTC. GitHub queues scheduled workflows best-effort and this job was
    # routinely firing 4-7 hours after an "0 8" cron - past the 09:30 UTC (10:30
    # BST) slot every single day, so every share went out immediately at a random
    # hour instead. Starting this early leaves 7h+ of headroom, and an off-the-hour
    # minute avoids the most contended slot on the shared runners.
    - cron: "17 2 * * *"      # daily 02:17 UTC; the post itself lands at 10:30 UK
  workflow_dispatch:
    inputs:
      limit:
        description: "How many articles to share this run (default 2 = two per day)"
        required: false
        default: "2"
      networks:
        description: "Comma list of target networks"
        required: false
        default: "linkedin,facebook,gmb"
      live:
        description: "Actually send? Use false for a dry-run plan."
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: blog-share
  cancel-in-progress: false

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # HEAD carries ~958 MB of tracked assets. Check out only the paths this
          # job reads, or every run pays minutes to download art it never opens.
          # Non-cone mode: these are gitignore-style paths, not cone prefixes.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /social-media/tools/*.py
            /social-media/content/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # blog_share.py uses only the Python standard library - nothing to install.

      - name: Share the day's blog post
        env:
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
        # pipefail: without it `tee` masks a crash and the job reports success.
        run: |
          set -o pipefail
          EXTRA_ARGS=()
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ github.event.inputs.live }}" = "true" ]; then
            EXTRA_ARGS+=(--live)
          fi
          python social-media/tools/blog_share.py \
            --daily --schedule \
            --limit "${{ github.event.inputs.limit || '2' }}" \
            --network "${{ github.event.inputs.networks || 'linkedin,facebook,gmb' }}" \
            "${EXTRA_ARGS[@]}" | tee /tmp/blog_share.log

      - name: Commit the dedupe record if it changed
        run: |
          FILE="social-media/content/blog_shared.json"
          if [ -z "$(git status --porcelain $FILE)" ]; then
            echo "Nothing newly shared this run."
            exit 0
          fi
          git config user.name  "internwise-content-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Blog re-share: shared the day's post ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
