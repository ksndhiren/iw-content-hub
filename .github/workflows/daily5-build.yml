name: Daily-5 Build

# The hands-free weekly content build. Runs Saturday (once the full past-week
# analytics are in) and sources content (banks + topic engine), has the LLM write
# every on-screen text + caption, renders the active evergreen lanes (quote,
# poll/conversation, education) x 5 days from their design libraries, and commits the week to
# data/weeks.json as `in-review`. NEWS is built separately by news-daily.yml the
# day before it posts (so it is never stale); this batch preserves any news posts
# already added for the week on a re-run. That auto-redeploys the dashboard, where
# the ONE human gate lives: review + approve before anything goes to Ayrshare.
#
# Targets the UPCOMING week automatically (build_week.target_week). Override with
# a WEEK_ID input on manual runs.
#
# Requires repo secret: OPENAI_API_KEY  (optional repo variable OPENAI_MODEL).

on:
  schedule:
    - cron: "0 7 * * 6"       # every Saturday 07:00 UTC (past-week data is complete by Fri; queues next week for review)
  workflow_dispatch:
    inputs:
      week_id:
        description: "Week id to build (e.g. week15). Blank = upcoming week."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily5-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # These render graphics, so they need the asset library - but not the
          # 413 MB of committed render byproducts and test output under
          # campaigns/ and test_output*/, which .gitignore covers today and no
          # script reads. Leading '!' excludes.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/social-media/campaigns/
            !/social-media/tools/campaigns/
            !/social-media/test_output/
            !/social-media/test_output_cv/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements-render.txt

      - name: Cache the Playwright browser
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-${{ hashFiles('automation/requirements-render.txt') }}

      - name: Install dependencies
        timeout-minutes: 6
        run: |
          pip install -r automation/requirements-render.txt
          python -m playwright install --with-deps chromium

      - name: Build the week (source -> LLM copy -> render -> weeks.json)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          WEEK_ID: ${{ github.event.inputs.week_id }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -o pipefail   # a build_week crash must fail the job, not be masked by tee
          python social-media/tools/build_week.py | tee /tmp/build.log

      - name: Commit and push to main if there are changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes - nothing built. Done."
            exit 0
          fi

          git config user.name  "internwise-content-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A images data/weeks.json \
            social-media/content/nuno_ledger.json \
            social-media/content/nuno_needed.json \
            social-media/content/design_ledger.json \
            social-media/content/education_used.json
          git commit -m "Daily-5 build ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "Pushed the week as in-review; Cloudflare Pages will redeploy. Review on the dashboard before Ayrshare."
