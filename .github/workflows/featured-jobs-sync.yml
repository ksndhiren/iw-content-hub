name: Featured Jobs Sync

# Runs the automation pipeline daily: scrapes the live Featured Jobs section,
# generates graphics for any NEW jobs, and commits them straight to main. That
# auto-redeploys the Cloudflare Pages dashboard, where the "new graphics" badge
# flags anything you haven't seen yet. Review happens on the dashboard.

on:
  schedule:
    - cron: "0 6 * * *"     # every day at 06:00 UTC
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: featured-jobs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r automation/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run featured-jobs sync
        run: python automation/sync_featured_jobs.py | tee /tmp/sync.log

      - name: Commit and push to main if there are changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes - no new featured jobs. Nothing to do."
            exit 0
          fi

          git config user.name  "internwise-content-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/featured.json images/featured
          git commit -m "Featured jobs sync ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main

          echo "Pushed new featured graphics to main; Cloudflare Pages will redeploy."
          grep '+ generated' /tmp/sync.log || true
