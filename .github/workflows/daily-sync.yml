name: Daily Sync

# ONE daily job for the two unattended data refreshes that used to be a workflow
# each (Featured Jobs Sync at 06:00, Analytics Build at 06:30). They were merged
# on 2026-10-27 to stop paying twice for checkout, Python setup and GitHub's
# per-job minute rounding: two ~80s jobs billed 4 minutes a day between them.
#
# Step 1 scrapes the live Featured Jobs section, renders graphics for new jobs,
# pushes them to R2 and commits the JSON manifests.
# Step 2 pulls Ayrshare analytics and commits data/analytics.json.
#
# The two are independent, so the analytics steps run even if the scrape fails
# (`if: always()`); a red run therefore still means "something broke", but never
# "the other half silently stopped happening".
#
# Requires repo secrets: AYRSHARE_API_KEY + the R2_* set.

on:
  schedule:
    - cron: "0 6 * * *"     # every day at 06:00 UTC
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  # Shared with Featured Jobs - Publish & Prune so the two never push over each other.
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # A stalled `playwright install` ran for SIX HOURS on 2026-10-22 before the
    # repo-default timeout killed it, burning 361 billable minutes - a third of
    # the monthly allowance in one run. Nothing here legitimately takes 20 min.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # HEAD carries ~958 MB of tracked assets (social-media/assets, campaigns,
          # models). This job reads about 3 MB of it, so check out only what the
          # scripts actually open. Non-cone mode: these are gitignore-style paths.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /automation/
            /data/
            /social-media/tools/*.py
            /social-media/content/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Cache the Playwright browser
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-${{ hashFiles('automation/requirements.txt') }}

      - name: Install dependencies
        # Step-level timeout as well as the job one: this exact step is what hung
        # on 2026-10-22, and the apt half of --with-deps cannot be cached.
        timeout-minutes: 6
        run: |
          pip install -r automation/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run featured-jobs sync
        # Graphics are shrunk and pushed to Cloudflare R2 by the sync itself; only
        # the JSON manifests are committed back to the repo (images left git long ago).
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
        # pipefail: without it `tee` masks a scrape/render crash.
        run: |
          set -o pipefail
          python automation/sync_featured_jobs.py | tee /tmp/sync.log

      - name: Commit and push new featured jobs
        run: |
          if [ -z "$(git status --porcelain data/featured.json data/featured_published.json)" ]; then
            echo "No changes - no new featured jobs. Nothing to do."
            exit 0
          fi

          git config user.name  "internwise-content-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/featured.json data/featured_published.json
          git commit -m "Featured jobs sync ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

          echo "Pushed new featured graphics to main; Cloudflare rebuilds the dashboard."
          grep '+ generated' /tmp/sync.log || true

      - name: Build analytics.json from Ayrshare
        # Independent of the scrape above - run it even if that failed.
        if: always()
        env:
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
        run: python social-media/tools/build_analytics.py --records 80 | tee /tmp/analytics.log

      - name: Commit and push refreshed analytics
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/analytics.json social-media/content/analytics_insights.json)" ]; then
            echo "No analytics change this run."
            exit 0
          fi
          git config user.name  "internwise-content-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/analytics.json social-media/content/analytics_insights.json
          git commit -m "Analytics refresh ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "Pushed analytics; Cloudflare rebuilds the dashboard."
