name: Deploy Cloudflare Pages

# MANUAL FALLBACK ONLY. Cloudflare deploys this repository itself: its Pages
# build runs scripts/pages-build.sh (the project's build command) and uploads
# .pages-dist, on Cloudflare's own free build minutes. Verified 2026-10-27 -
# commit 4523d90 was live 80 seconds after the push, /api/statuses answering 200
# with the STATUSES KV binding intact.
#
# The automatic triggers are gone so this cannot race that build. Two deployers
# on one project meant last-writer-wins per push, and `cancel-in-progress` only
# ever coordinated the Actions side of it.
#
# Press "Run workflow" if Cloudflare is ever down or its build is misconfigured;
# this deploys the current main the same way, through wrangler. It shares
# scripts/pages-build.sh with the Cloudflare build, so both ship an identical
# file set.
#
# History: this was October's biggest consumer of GitHub Actions minutes - 211
# runs and 328 billable minutes, about 8 deploys a day, because it listened for
# `workflow_run: types: [completed]` across six workflows and fired even when
# the upstream run had failed or pushed nothing.
#
# To check what is actually live, without opening either dashboard:
#   curl -s https://iw-content-hub.pages.dev/deploy-check.txt   # prints the commit SHA

on:
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Only the dashboard payload; the 958 MB asset tree is not deployed.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /app.js
            /style.css
            /logo.svg
            /wrangler.toml
            /data/
            /functions/
            /images/
            /scripts/

      - name: Prepare Pages artifact
        # Same script the Cloudflare-side build runs, so the two paths cannot drift.
        run: bash scripts/pages-build.sh

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --project-name=iw-content-hub --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
