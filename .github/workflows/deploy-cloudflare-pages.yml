name: Deploy Cloudflare Pages

# This workflow deploys the dashboard. Cloudflare's own Git integration is
# connected and set to "Automatic deployments enabled", but its builds FAIL:
# wrangler.toml sets pages_build_output_dir = ".", and the repo root is ~958 MB
# with social-media/models/EDSR_x2.pb at 38 MB, past Cloudflare's 25 MiB
# per-file asset limit. Every Cloudflare-side build lands as "No deployment
# available" in the Pages dashboard. Commit 08ae1e9 briefly made this workflow
# dispatch-only to save Actions minutes; main then stopped deploying at all, so
# the automatic triggers are back. Do not remove them again until a Cloudflare
# build config stages a subset of files (see "Prepare Pages artifact" below for
# exactly what the deployment needs) and you have seen it go green.
#
# Cost control, since this was October's biggest minute consumer (211 runs, 328
# minutes - about 8 deploys a day):
#   * the sparse checkout takes a run from ~60s to ~25s;
#   * `if` skips the deploy when the upstream build FAILED - previously
#     `types: [completed]` fired even on failure, deploying nothing new.
#
# Bot commits authored with GITHUB_TOKEN do not raise `push`, which is why the
# content workflows are listed under workflow_run as well.

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Daily Sync", "Daily-5 Build", "Topic Engine", "News - Day-Prior Build", "Featured Jobs - Publish & Prune"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A failed upstream run has nothing new to deploy.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Only the dashboard payload; the 958 MB asset tree is not deployed.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /app.js
            /style.css
            /logo.svg
            /wrangler.toml
            /data/
            /functions/
            /images/
            /scripts/

      - name: Prepare Pages artifact
        # Same script the Cloudflare-side build runs, so the two paths cannot drift.
        run: bash scripts/pages-build.sh

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --project-name=iw-content-hub --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
