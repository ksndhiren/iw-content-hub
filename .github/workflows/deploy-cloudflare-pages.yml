name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  # Human pushes trigger the deploy above. Bot commits (GITHUB_TOKEN) do NOT
  # trigger `push`, so also deploy after the automated build workflows finish -
  # workflow_run fires even for GITHUB_TOKEN-authored runs.
  workflow_run:
    workflows: ["Daily-5 Build", "Topic Engine", "Featured Jobs Sync", "Featured Jobs - Publish & Prune", "Analytics Build", "News - Day-Prior Build"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          rm -rf .pages-dist
          mkdir -p .pages-dist
          cp index.html app.js style.css logo.svg wrangler.toml .pages-dist/
          cp -R data functions .pages-dist/
          # Weekly/featured graphics are gitignored (served from R2), so the
          # images/ tree is absent in CI. Copy it only when present so the
          # deploy does not fail under `set -e`.
          [ -d images ] && cp -R images .pages-dist/ || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .pages-dist --project-name=iw-content-hub --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
