name: Deploy Cloudflare Pages

# DORMANT since 2026-10-27. Cloudflare builds the dashboard from the connected
# repository itself, so this workflow no longer deploys on every push. It was by
# far the biggest steady-state consumer of GitHub Actions minutes - 211 runs and
# 328 billable minutes in October alone, roughly 8 deploys a day, because it
# listened for `workflow_run: types: [completed]` on six workflows and fired even
# when the upstream run FAILED or pushed nothing at all.
#
# Kept (dispatch-only, so it costs nothing unless you press the button) as a
# one-click fallback: if the Cloudflare-side build is ever misconfigured or
# paused, running this still deploys the current main.
#
# NOTE for whoever restores the automatic path: wrangler.toml sets
# pages_build_output_dir = ".", but the repo root is ~958 MB and
# social-media/models/EDSR_x2.pb alone is 38 MB - past Cloudflare's 25 MiB
# per-file asset limit. That is why the step below stages a .pages-dist folder
# with just the dashboard files. A Cloudflare-side build must do the equivalent.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Only the dashboard payload; the 958 MB asset tree is not deployed.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /app.js
            /style.css
            /logo.svg
            /wrangler.toml
            /data/
            /functions/
            /images/

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          rm -rf .pages-dist
          mkdir -p .pages-dist
          cp index.html app.js style.css logo.svg wrangler.toml .pages-dist/
          cp -R data functions .pages-dist/
          # Weekly/featured graphics are gitignored (served from R2), so the
          # images/ tree is absent in CI. Copy it only when present so the
          # deploy does not fail under `set -e`.
          [ -d images ] && cp -R images .pages-dist/ || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .pages-dist --project-name=iw-content-hub --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
